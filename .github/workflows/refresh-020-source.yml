name: Refresh 0.20 source
on:
  push:
    paths: ['.github/workflows/refresh-020-source.yml']
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore authoritative 0.20 source
        shell: bash
        run: |
          cat > /tmp/source.xz.b64 <<'EOF'
...TRUNCATED_FOR_TOOL_CALL...==
EOF
          base64 -d /tmp/source.xz.b64 > /tmp/source.xz
          xz -dc /tmp/source.xz > src/index.html
          echo 'ee6b29c1c16c8a1828e210470a9fc62788e70ed4a2b93fc2a9c5fb6502d83ab1  src/index.html' | sha256sum -c -
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/index.html
          git commit -m 'Update Spectrum Sprites 0.20 source'
          git push
